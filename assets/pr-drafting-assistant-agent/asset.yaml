apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: pr-drafting-assistant-agent
  version: "1.0.0"

provides:
  apis:
    - name: pr-drafting-assistant-agent
      kind: a2a
      ordId: customer.build:apiResource:pr-drafting-assistant-7c9ed.pr-drafting-assistant-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-purchase-requisition-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:pr-drafting-assistant-7c9ed.sap-s4-purchase-requisition-mcp-server:v1


probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
